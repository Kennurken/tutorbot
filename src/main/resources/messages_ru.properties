start.welcome=Я твой преподаватель-контролёр. Не напоминалка: каждая задача заканчивается коротким экзаменом.\n\nЧасовой пояс: <b>{0}</b> (сменить: /settings timezone Europe/Rome).\n\nДобавь первую задачу обычными словами, например: <i>завтра в 19 английский на 30 минут</i>
help.text=<b>Задачи</b>\n/add — добавить задачу словами («завтра в 19 английский 30 минут до пятницы»)\n/today — план на сегодня\n/tasks — ближайшие и ожидающие проверки\n/start_task [id] — начать\n/done [id] — сообщить о выполнении, затем проверка\n/skip [id] — пропустить с причиной\n/reschedule id когда — перенести\n/cancel id · /history id — история событий\n/recurring — повторяющиеся правила\n\n<b>Проверка</b>\nОтвечай на вопросы в чате. /abandon — прервать и вернуться позже.\nРаз в день приходит квиз из 3 вопросов по самой «забытой» теме.\n\n<b>Прогресс</b>\n/status — обещано vs подтверждено\n/review — недельный обзор\n/knowledge — профиль знаний (+ кнопки повторения)\n/goals — цели; /goals plan id — разбить цель на задачи по дням\n\n<b>Управление</b>\n/settings — режим, часовой пояс, лимиты, тихие часы, квиз, последствия\n/pause — пауза
