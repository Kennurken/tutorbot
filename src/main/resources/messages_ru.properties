start.welcome=Я твой преподаватель-контролёр. Не напоминалка: каждая задача заканчивается коротким экзаменом.\n\nЧасовой пояс: <b>{0}</b> (сменить: /settings timezone Europe/Rome).\n\nДобавь первую задачу обычными словами, например: <i>завтра в 19 английский на 30 минут</i>
help.text=<b>Задачи</b>\n/add — добавить задачу словами\n/today — план на сегодня\n/tasks — ближайшие и ожидающие проверки\n/start_task [id] — начать\n/done [id] — сообщить о выполнении, затем проверка\n/skip [id] — пропустить с причиной\n/reschedule id когда — перенести\n/cancel id\n/recurring — повторяющиеся правила\n\n<b>Проверка</b>\nОтвечай на вопросы в чате. /abandon — прервать и вернуться позже.\n\n<b>Прогресс</b>\n/status — обещано vs подтверждено\n/review — недельный обзор\n/knowledge — профиль знаний\n/goals — долгосрочные цели\n\n<b>Управление</b>\n/settings — режим, часовой пояс, лимиты, последствия\n/pause — пауза
