spring:
  application:
    name: tutorbot
  # Local convenience: a .env file next to the jar is read as properties (never committed).
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tutorbot}
    username: ${DATABASE_USERNAME:tutorbot}
    password: ${DATABASE_PASSWORD:tutorbot}
    hikari:
      # Free-tier Postgres (Supabase) allows few connections; a personal bot needs very few.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 2
  threads:
    virtual:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    dev.kennurken.tutorbot: INFO
    org.hibernate.SQL: WARN

app:
  default-timezone: ${APP_DEFAULT_TIMEZONE:Asia/Almaty}
  default-language: ${APP_DEFAULT_LANGUAGE:ru}

telegram:
  token: ${TELEGRAM_BOT_TOKEN:}
  mode: ${TELEGRAM_MODE:polling}          # polling | webhook
  webhook-url: ${TELEGRAM_WEBHOOK_URL:${RENDER_EXTERNAL_URL:}}   # Render injects RENDER_EXTERNAL_URL
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  allowed-user-ids: ${TELEGRAM_ALLOWED_USER_IDS:}
  polling-timeout-seconds: 25

ai:
  provider: ${AI_PROVIDER:gateway}       # gateway | fake
  base-url: ${AI_BASE_URL:https://ai-gateway.vercel.sh/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:spacexai/grok-4.1-fast-non-reasoning}
  fallback-model: ${AI_FALLBACK_MODEL:}
  timeout: 40s
  max-retries: 2
  circuit-breaker:
    failure-threshold: 4
    open-duration: 2m
  rate-limit:
    per-user-per-minute: 12
  pricing:
    # USD per 1M tokens, used only for cost estimates in ai_interactions
    input-per-million: ${AI_PRICE_INPUT_PER_MILLION:0.20}
    output-per-million: ${AI_PRICE_OUTPUT_PER_MILLION:0.50}

scheduler:
  enabled: true
  tick-interval: 30s
  tick-secret: ${TICK_SECRET:}
  recurrence-lookahead: 36h

accountability:
  reminder-after: 10m        # "you haven't started"
  overdue-after: 20m         # "task overdue"
  grace-period: 30m          # not started by then -> MISSED
  verification:
    min-questions: 2
    max-questions: 4
    session-timeout: 45m
    min-answer-words: 8
  overload:
    missed-per-day: 3
    missed-per-week: 6
