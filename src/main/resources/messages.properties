# ---- commands ---------------------------------------------------------------
start.welcome=I am your accountability tutor. Not a reminder bot: every task ends with a short exam.\n\nYour timezone is set to <b>{0}</b> (change: /settings timezone Europe/Rome).\n\nAdd your first task in plain words, for example: <i>tomorrow at 19:00 English 30 min</i>
help.text=<b>Tasks</b>\n/add — add a task in plain words\n/today — today's plan\n/tasks — upcoming and pending\n/start_task [id] — start\n/done [id] — report done, then verification\n/skip [id] — skip with a reason\n/reschedule id when — move a task\n/cancel id\n/recurring — recurring rules\n\n<b>Verification</b>\nAnswer the questions in chat. /abandon to stop and retry later.\n\n<b>Progress</b>\n/status — promised vs. verified\n/review — weekly review\n/knowledge — knowledge profile\n/goals — long-term goals\n\n<b>Control</b>\n/settings — mode, timezone, limits, consequences\n/pause — pause accountability
error.generic=Something went wrong on my side. Try again in a minute.
error.unknown_command=Unknown command. /help
error.notallowed=This bot is private.

