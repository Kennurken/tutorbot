name: Keep-alive

# Backup for the in-app self-ping: Render's free tier sleeps without inbound traffic.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="${{ vars.APP_URL || 'https://tutorbot-a2zc.onrender.com' }}"
          curl -fsS --max-time 90 --retry 3 --retry-delay 20 "$url/actuator/health"
