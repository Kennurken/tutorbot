name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutorbot_test
          POSTGRES_USER: tutorbot
          POSTGRES_PASSWORD: tutorbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tutorbot -d tutorbot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit + integration tests
        run: mvn -B verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/tutorbot_test
      - name: Docker image builds
        run: docker build -t tutorbot:ci .
