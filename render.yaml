# Render Blueprint: "New > Blueprint" in the Render dashboard, point it at this repo.
# Free web service built from the Dockerfile. Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: tutorbot
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false          # Supabase session pooler JDBC URL, see docs/DEPLOYMENT.md
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: gateway
      # Groq free tier (no card): OpenAI-compatible, open-weight gpt-oss models.
      # Switch back to Vercel AI Gateway (Grok) by changing these three values.
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: AI_PRICE_INPUT_PER_MILLION
        value: "0.15"
      - key: AI_PRICE_OUTPUT_PER_MILLION
        value: "0.60"
      - key: TICK_SECRET
        generateValue: true
      - key: APP_DEFAULT_TIMEZONE
        value: Asia/Almaty
